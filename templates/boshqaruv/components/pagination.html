{% if page %}<nav class="pagination" aria-label="Sahifalar"><span>{{ page.start_index }}–{{ page.end_index }} / {{ page.paginator.count }} yozuv</span><div>{% if page.has_previous %}<a class="button compact" href="?{{ page.querystring }}&page={{ page.previous_page_number }}">Oldingi</a>{% endif %}<b>{{ page.number }} / {{ page.paginator.num_pages }}</b>{% if page.has_next %}<a class="button compact" href="?{{ page.querystring }}&page={{ page.next_page_number }}">Keyingi</a>{% endif %}</div></nav>{% endif %}
