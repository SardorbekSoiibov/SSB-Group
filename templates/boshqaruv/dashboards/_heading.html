{% load boshqaruv %}<header class="page-heading"><div><span class="eyebrow">{{ user.role }} / SSB GROUP</span><h1>{{ role_heading }}</h1><p>Salom, {{ user.first_name|default:user.username }}. {{ dashboard_intro }}</p></div><div class="heading-actions"><form method="get"><select name="currency" class="button compact" data-auto-submit aria-label="Hisob valyutasi">{% for code,label in currencies %}<option value="{{ code }}" {% if currency == code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></form><span class="date-chip">{{ app_today|date:app_date_format }}</span></div></header>
