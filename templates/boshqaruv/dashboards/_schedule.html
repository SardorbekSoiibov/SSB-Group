<section class="panel"><header class="panel-head"><h2>Yaqin ish kunlari</h2><a class="text-link" href="{% url 'enterprise:schedule' %}">Taqvim →</a></header><ul class="feed">{% for shift in shifts %}<li><div class="feed-body"><strong>{{ shift.starts_at|date:'d.m' }} · {{ shift.employee }}</strong><p>{{ shift.starts_at|date:'H:i' }}–{{ shift.ends_at|date:'H:i' }} · {{ shift.location }}</p></div></li>{% empty %}<li><p class="empty-inline">Yaqin ish jadvali belgilanmagan.</p></li>{% endfor %}</ul></section>
