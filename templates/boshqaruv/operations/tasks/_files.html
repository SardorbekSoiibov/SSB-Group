{% load boshqaruv %}{% if files %}<ul class="ws-files">{% for item in files %}<li><a href="{% url route item.pk %}">{% if item.is_image %}<img src="{% url route item.pk %}?korish=1" alt="" loading="lazy">{% else %}<i class="ws-file-icon">{% ui_icon 'file' %}</i>{% endif %}<span>{{ item.original_name }}</span><small>{{ item.uploaded_by.display_name|default:'—' }} · {{ item.size|plain_filesize }}</small></a></li>{% endfor %}</ul>{% else %}<p class="project-empty">{{ empty_text }}</p>{% endif %}
