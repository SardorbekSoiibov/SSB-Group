<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Xatolik — SSB Group</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#000;--ink2:rgba(60,60,67,.6);--blue:#007aff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#fff;--ink2:rgba(235,235,245,.6);--blue:#0a84ff}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(420px,100%);padding:36px 28px;border-radius:28px;background:var(--card);text-align:center;box-shadow:0 30px 60px -30px rgb(0 0 0/.25)}
.i{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;background:color-mix(in srgb,#ff9500 16%,transparent);color:#ff9500;font-size:30px;font-weight:700}
h1{margin:18px 0 8px;font-size:24px;letter-spacing:-.02em}p{margin:0 0 24px;color:var(--ink2)}
a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:999px;background:var(--blue);color:#fff;font-weight:600;text-decoration:none}
</style></head>
<body><main><span class="i" aria-hidden="true">!</span><h1>Serverda xatolik yuz berdi</h1><p>Muammo qayd etildi. Birozdan keyin sahifani yangilang yoki bosh sahifaga qayting.</p><a href="/">Bosh sahifa</a></main></body></html>
