<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}" class="field-label">{{ field.label }}{% if not field.field.required %} <span class="optional">(ixtiyoriy)</span>{% endif %}</label>
  {{ field }}
  {% for e in field.errors %}<p class="field-error" id="{{ field.id_for_label }}-error">{{ e }}</p>{% endfor %}
</div>
